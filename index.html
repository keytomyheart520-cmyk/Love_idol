<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>love_idol 演唱會日記</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D8B6B3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="love_idol">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBD9D6; --ink:#4A3A3C; --card:#F8F0ED; --stub:#D8B6B3; --accent:#98595F; --accent-ink:#FFFFFF;
  --muted:#84706F; --line:#D2B9B6; --star:#C98A4B; --heart:#B9545F;
  --font:"Huninn","Zen Maru Gothic","PingFang TC","Microsoft JhengHei",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2E2426; --ink:#F3E6E4; --card:#3B2E30; --stub:#5A4144; --accent:#D89AA1; --accent-ink:#2E1A1D;
    --muted:#B9A3A2; --line:#4E3B3E; --star:#E3AE6C; --heart:#E88C98;
  }
}
:root[data-theme="dark"]{
  --bg:#2E2426; --ink:#F3E6E4; --card:#3B2E30; --stub:#5A4144; --accent:#D89AA1; --accent-ink:#2E1A1D;
  --muted:#B9A3A2; --line:#4E3B3E; --star:#E3AE6C; --heart:#E88C98;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:var(--font)}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:34px;letter-spacing:.06em;margin:8px 0 2px;font-weight:400;text-align:center}
.sub{color:var(--muted);margin:0 0 18px;font-size:14px;text-align:center}
.search{width:100%;padding:12px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:15px;margin-bottom:16px}
.search:focus,.field:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.ticket{position:relative;display:flex;background:var(--card);border-radius:18px;margin-bottom:14px;cursor:pointer;width:100%;text-align:left;border:0;color:inherit;font-size:16px;padding:0}
.ticket .main{flex:1;min-width:0;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.ticket .thumb{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none}
.ticket .txt{min-width:0;flex:1}
.ticket .stub{width:84px;flex:none;background:var(--stub);border-radius:0 18px 18px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed var(--bg);padding:8px 4px}
.ticket .stub b{font-size:30px;line-height:1;font-weight:400}
.ticket .stub span{font-size:12px;opacity:.8;margin-top:4px}
.ticket::before,.ticket::after{content:"";position:absolute;right:73px;width:16px;height:16px;border-radius:50%;background:var(--bg)}
.ticket::before{top:-8px}.ticket::after{bottom:-8px}
.artist{font-size:19px;margin:0;overflow-wrap:anywhere;line-height:1.35}
.tour{font-size:14px;color:var(--muted);margin:0 0 4px;overflow-wrap:anywhere}
.stars{color:var(--star);letter-spacing:2px;font-size:15px}
.snip{font-size:14px;margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{font-size:13px;color:var(--muted);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:48px 12px;border:2px dashed var(--line);border-radius:18px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 28px;font-size:16px;box-shadow:0 6px 18px rgba(74,40,44,.3);cursor:pointer}

.sheet-bg{position:fixed;inset:0;background:rgba(50,28,32,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:23px;margin:0 0 12px;font-weight:400}
label,.lab{display:block;font-size:14px;margin:14px 0 5px;color:var(--muted)}
.field{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-size:16px}
textarea.field{min-height:110px;resize:vertical}
textarea.song-in{min-height:0;height:44px}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.starpick{display:flex;gap:4px}
.starpick button{background:none;border:0;font-size:30px;color:var(--line);cursor:pointer;padding:0 2px;line-height:1}
.starpick button.on{color:var(--star)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-block;background:var(--stub);border-radius:999px;padding:2px 12px;font-size:13px;margin:0 6px 6px 0}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{flex:1;min-width:110px;padding:12px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--accent)}
.meta{color:var(--muted);font-size:14px;margin:0 0 4px}
.block{background:var(--card);border-radius:16px;padding:12px 16px;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.block h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:400}

.songs{list-style:none;margin:0;padding:0}
.songs li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.songs li:last-child{border-bottom:0}
.songs .no{width:26px;color:var(--muted);font-size:13px;text-align:right;flex:none}
.songs .t{flex:1;min-width:0;overflow-wrap:anywhere}
.songs .ic{background:none;border:0;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:var(--line)}
.songs .ic.fav{color:var(--heart)}
.songs .heart{color:var(--heart)}
.addrow{display:flex;gap:8px;align-items:flex-start;margin-top:8px}
.addrow .field{flex:1}
.addrow .btn{flex:none;min-width:70px;padding:10px 14px}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.grid .ph{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--stub);border:0;padding:0;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid .rm{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;background:rgba(40,20,24,.7);color:#fff;border:0;font-size:16px;line-height:1;cursor:pointer}
.addph{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;text-align:center;cursor:pointer;background:transparent}

.lb{position:fixed;inset:0;background:rgba(30,14,18,.92);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <h1>演唱會日記</h1>
  <p class="sub" id="count"></p>
  <input class="search" id="q" type="search" placeholder="搜尋藝人、巡迴、歌名或心得" aria-label="搜尋">
  <div id="list"></div>
</div>
<button class="fab" id="add">＋ 新增心得</button>

<div class="sheet-bg" id="bg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="lb" id="lb"><img id="lbimg" alt="演唱會照片"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY="items", OLD="concert-journal-v1", MAXPH=9;
  var MOODS=["感動","哭爆","嗨翻","還想再去","音響超讚","安可太棒","舞台好美","體力耗盡"];
  var items=[], q="", loaded=false;

  /* ---------- storage: IndexedDB first, localStorage fallback ---------- */
  function idb(){ return new Promise(function(res,rej){
    try{
      var r=indexedDB.open("concert-journal",1);
      r.onupgradeneeded=function(){ r.result.createObjectStore("kv"); };
      r.onsuccess=function(){ res(r.result); };
      r.onerror=function(){ rej(r.error); };
    }catch(e){ rej(e); }
  }); }
  function idbGet(k){ return idb().then(function(db){ return new Promise(function(res,rej){
    var g=db.transaction("kv","readonly").objectStore("kv").get(k);
    g.onsuccess=function(){ res(g.result); }; g.onerror=function(){ rej(g.error); };
  }); }); }
  function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){
    var t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k);
    t.oncomplete=function(){ res(); }; t.onerror=function(){ rej(t.error); }; t.onabort=function(){ rej(t.error); };
  }); }); }
  function lsGet(k){ try{ var v=JSON.parse(localStorage.getItem(k)||"null"); return Array.isArray(v)?v:null; }catch(e){ return null; } }
  function save(){
    idbSet(KEY,items).catch(function(){
      try{ localStorage.setItem(OLD,JSON.stringify(items)); }
      catch(e){ toast("儲存失敗：空間不足或瀏覽器不允許儲存"); }
    });
  }
  function load(){
    return idbGet(KEY).then(function(v){
      if(Array.isArray(v)) return v;
      return lsGet(OLD)||[];
    }).catch(function(){ return lsGet(OLD)||[]; });
  }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
  function $(id){ return document.getElementById(id); }
  function stars(n){ n=+n||0; return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n); }
  function toast(t){ var el=$("toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(function(){el.style.display="none";},2400); }
  function dparts(d){ if(!d) return {day:"--",ym:"未填日期"}; var p=d.split("-"); return {day:p[2]||"--",ym:p[0]+"/"+p[1]}; }
  function fmt(d){ if(!d) return "未填日期"; var p=d.split("-"); return p[0]+" 年 "+(+p[1])+" 月 "+(+p[2])+" 日"; }
  function songsOf(i){ return Array.isArray(i.songs)?i.songs:[]; }
  function photosOf(i){ return Array.isArray(i.photos)?i.photos:[]; }

  function compress(file){ return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1000, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
      var c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",0.72));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src=url;
  }); }

  /* ---------- list ---------- */
  function render(){
    var kw=q.trim().toLowerCase();
    var shown=items.filter(function(i){
      if(!kw) return true;
      return [i.artist,i.tour,i.venue,i.moment,i.note,(i.moods||[]).join(" "),songsOf(i).map(function(s){return s.t;}).join(" ")].join(" ").toLowerCase().indexOf(kw)>-1;
    }).sort(function(a,b){ return (b.date||"").localeCompare(a.date||"") || b.id-a.id; });
    $("count").textContent = items.length ? "已記錄 "+items.length+" 場演唱會" : "把每一場的感動都留下來";
    if(!shown.length){
      $("list").innerHTML = !loaded ? "" : items.length
        ? '<div class="empty">找不到符合的心得，換個關鍵字試試</div>'
        : '<div class="empty">還沒有任何紀錄<br>看完演唱會後，點下方「新增心得」寫下第一場</div>';
      return;
    }
    $("list").innerHTML = shown.map(function(i){
      var d=dparts(i.date), ph=photosOf(i), sg=songsOf(i), extra=[];
      if(sg.length) extra.push("歌單 "+sg.length+" 首");
      if(ph.length) extra.push(ph.length+" 張照片");
      return '<button class="ticket" data-id="'+i.id+'"><div class="main">'
        +(ph.length?'<img class="thumb" alt="" src="'+ph[0]+'">':'')
        +'<div class="txt"><p class="artist">'+esc(i.artist||"未命名")+'</p>'
        +'<p class="tour">'+esc(i.tour||"")+(i.venue?(i.tour?"｜":"")+esc(i.venue):"")+'</p>'
        +'<div class="stars" aria-label="'+(i.rating||0)+' 顆星">'+stars(i.rating)+'</div>'
        +(i.moment||i.note?'<p class="snip">'+esc(i.moment||i.note)+'</p>':'')
        +(extra.length?'<div class="mini">'+extra.join("｜")+'</div>':'')
        +'</div></div><div class="stub"><b>'+esc(d.day)+'</b><span>'+esc(d.ym)+'</span></div></button>';
    }).join("");
  }

  function open(html){ $("sheet").innerHTML=html; $("bg").classList.add("open"); $("sheet").scrollTop=0; }
  function close(){ $("bg").classList.remove("open"); }
  function lightbox(src){ $("lbimg").src=src; $("lb").classList.add("open"); }

  /* ---------- detail ---------- */
  function showDetail(id){
    var i=items.filter(function(x){return x.id===id;})[0]; if(!i) return;
    var sg=songsOf(i), ph=photosOf(i);
    var h='<h2>'+esc(i.artist||"未命名")+'</h2>'
      +'<p class="meta">'+esc(i.tour||"")+'</p>'
      +'<p class="meta">'+fmt(i.date)+(i.venue?"｜"+esc(i.venue):"")+(i.seat?"｜"+esc(i.seat):"")+'</p>'
      +'<div class="stars" style="font-size:20px">'+stars(i.rating)+'</div>'
      +'<div style="margin-top:10px">'+(i.moods||[]).map(function(m){return '<span class="tag">'+esc(m)+'</span>';}).join("")+'</div>'
      +(ph.length?'<div class="grid">'+ph.map(function(p,n){return '<button class="ph" data-n="'+n+'" aria-label="放大照片 '+(n+1)+'"><img alt="" src="'+p+'"></button>';}).join("")+'</div>':'')
      +(i.moment?'<div class="block"><h3>最難忘的瞬間</h3>'+esc(i.moment)+'</div>':'')
      +(sg.length?'<div class="block" style="white-space:normal"><h3>歌單（'+sg.length+' 首）</h3><ol class="songs" style="list-style:none">'
        +sg.map(function(s,n){return '<li><span class="no">'+(n+1)+'</span><span class="t">'+esc(s.t)+'</span>'+(s.fav?'<span class="heart" aria-label="最愛">♥</span>':'')+'</li>';}).join("")+'</ol></div>':'')
      +(i.note?'<div class="block"><h3>心得</h3>'+esc(i.note)+'</div>':'')
      +'<div class="actions"><button class="btn" id="copy">複製心得</button><button class="btn" id="edit">編輯</button><button class="btn danger" id="del">刪除</button></div>'
      +'<div class="actions"><button class="btn" id="closeb">關閉</button></div>';
    open(h);
    var g=$("sheet").querySelector(".grid");
    if(g) g.onclick=function(e){ var b=e.target.closest(".ph"); if(b) lightbox(ph[+b.getAttribute("data-n")]); };
    $("copy").onclick=function(){
      var t=(i.artist||"")+" "+(i.tour||"")+"\n"+fmt(i.date)+(i.venue?" "+i.venue:"")+"\n"+stars(i.rating)+(i.moods&&i.moods.length?"\n#"+i.moods.join(" #"):"")
        +(i.moment?"\n\n最難忘：\n"+i.moment:"")
        +(sg.length?"\n\n歌單：\n"+sg.map(function(s,n){return (n+1)+". "+s.t+(s.fav?" ♥":"");}).join("\n"):"")
        +(i.note?"\n\n心得：\n"+i.note:"");
      try{ navigator.clipboard.writeText(t).then(function(){toast("已複製");},function(){toast("無法複製，請手動選取文字");}); }catch(e){ toast("無法複製，請手動選取文字"); }
    };
    $("edit").onclick=function(){ showForm(i); };
    $("del").onclick=function(){
      var box=$("del").parentNode;
      box.innerHTML='<p class="meta" style="width:100%;margin:0">確定刪除這則心得？刪除後無法復原</p>'
        +'<button class="btn" id="delno">取消</button><button class="btn primary" id="delyes">確定刪除</button>';
      $("delno").onclick=function(){ showDetail(i.id); };
      $("delyes").onclick=function(){ items=items.filter(function(x){return x.id!==i.id;}); save(); close(); render(); toast("已刪除"); };
    };
    $("closeb").onclick=close;
  }

  /* ---------- form ---------- */
  function showForm(i){
    var isNew=!i; i=i||{rating:0,moods:[],date:new Date().toISOString().slice(0,10)};
    var rating=i.rating||0, moods=(i.moods||[]).slice(), songs=songsOf(i).map(function(s){return {t:s.t,fav:!!s.fav};}), photos=photosOf(i).slice();
    var h='<h2>'+(isNew?"新增心得":"編輯心得")+'</h2>'
      +'<label for="f-artist">藝人／團體</label><input class="field" id="f-artist" value="'+esc(i.artist)+'">'
      +'<label for="f-tour">演唱會名稱</label><input class="field" id="f-tour" value="'+esc(i.tour)+'">'
      +'<div class="row"><div><label for="f-date">日期</label><input class="field" type="date" id="f-date" value="'+esc(i.date)+'"></div>'
      +'<div><label for="f-seat">座位</label><input class="field" id="f-seat" value="'+esc(i.seat)+'" placeholder="例：紅2A 12排"></div></div>'
      +'<label for="f-venue">場館</label><input class="field" id="f-venue" value="'+esc(i.venue)+'">'
      +'<div class="lab">整體評分</div><div class="starpick" id="sp"></div>'
      +'<div class="lab">心情標籤</div><div class="chips" id="chips"></div>'
      +'<div class="addrow"><input class="field" id="mood-in" maxlength="12" placeholder="自訂標籤，例：想哭又想笑"><button type="button" class="btn" id="mood-add">新增</button></div>'
      +'<div class="lab">照片（最多 '+MAXPH+' 張）</div><div class="grid" id="ph"></div>'
      +'<input type="file" id="file" accept="image/*" multiple hidden>'
      +'<div class="lab">歌單</div><ol class="songs" id="songs"></ol>'
      +'<div class="addrow"><textarea class="field song-in" id="song-in" placeholder="輸入歌名，按 Enter 加入" rows="1"></textarea><button type="button" class="btn" id="song-add">加入</button></div>'
      +'<p class="hint">可一次貼上多首，每行一首；點 ♥ 標記最愛的歌</p>'
      +'<label for="f-moment">最難忘的瞬間</label><input class="field" id="f-moment" value="'+esc(i.moment)+'" placeholder="一句話就好">'
      +'<label for="f-note">心得</label><textarea class="field" id="f-note">'+esc(i.note)+'</textarea>'
      +'<div class="actions"><button class="btn" id="cancel">取消</button><button class="btn primary" id="saveb">儲存心得</button></div>';
    open(h);

    function drawStars(){ $("sp").innerHTML=[1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'" class="'+(n<=rating?"on":"")+'" aria-label="'+n+' 顆星">★</button>';}).join(""); }
    var extra=[];
    function allMoods(){
      var s=MOODS.slice();
      function add(m){ if(m&&s.indexOf(m)<0) s.push(m); }
      items.forEach(function(x){ (x.moods||[]).forEach(add); });
      extra.forEach(add); moods.forEach(add);
      return s;
    }
    function drawChips(){ $("chips").innerHTML=allMoods().map(function(m){return '<button type="button" class="chip'+(moods.indexOf(m)>-1?" on":"")+'" data-m="'+esc(m)+'">'+esc(m)+'</button>';}).join(""); }
    function addMood(){
      var v=$("mood-in").value.replace(/^#+/,"").trim();
      if(!v) return;
      if(allMoods().indexOf(v)<0) extra.push(v);
      if(moods.indexOf(v)<0) moods.push(v);
      $("mood-in").value=""; drawChips();
    }
    function drawPhotos(){
      $("ph").innerHTML=photos.map(function(p,n){return '<div class="ph"><img alt="" src="'+p+'"><button type="button" class="rm" data-rm="'+n+'" aria-label="移除照片">×</button></div>';}).join("")
        +(photos.length<MAXPH?'<button type="button" class="addph" id="addph">＋ 加照片</button>':'');
      var a=$("addph"); if(a) a.onclick=function(){ $("file").click(); };
    }
    function drawSongs(){
      $("songs").innerHTML=songs.map(function(s,n){return '<li><span class="no">'+(n+1)+'</span><span class="t">'+esc(s.t)+'</span>'
        +'<button type="button" class="ic'+(s.fav?" fav":"")+'" data-fav="'+n+'" aria-label="標記最愛">♥</button>'
        +'<button type="button" class="ic" data-del="'+n+'" aria-label="移除歌曲">×</button></li>';}).join("");
    }
    function addSongs(){
      var v=$("song-in").value.split(/\r?\n/).map(function(x){return x.replace(/^\s*\d+[\.\)、]\s*/,"").trim();}).filter(Boolean);
      if(!v.length) return;
      v.forEach(function(t){ songs.push({t:t,fav:false}); });
      $("song-in").value=""; drawSongs();
    }
    drawStars(); drawChips(); drawPhotos(); drawSongs();

    $("sp").onclick=function(e){ var n=e.target.getAttribute&&e.target.getAttribute("data-n"); if(n){ rating=(rating===+n)?0:+n; drawStars(); } };
    $("chips").onclick=function(e){ var m=e.target.getAttribute&&e.target.getAttribute("data-m"); if(m){ var k=moods.indexOf(m); if(k>-1) moods.splice(k,1); else moods.push(m); drawChips(); } };
    $("ph").onclick=function(e){ var r=e.target.getAttribute&&e.target.getAttribute("data-rm"); if(r!==null&&r!==undefined){ photos.splice(+r,1); drawPhotos(); } };
    $("songs").onclick=function(e){
      var f=e.target.getAttribute&&e.target.getAttribute("data-fav"), d=e.target.getAttribute&&e.target.getAttribute("data-del");
      if(f!==null&&f!==undefined){ songs[+f].fav=!songs[+f].fav; drawSongs(); }
      else if(d!==null&&d!==undefined){ songs.splice(+d,1); drawSongs(); }
    };
    $("mood-add").onclick=addMood;
    $("mood-in").onkeydown=function(e){ if(e.key==="Enter"&&!e.isComposing){ e.preventDefault(); addMood(); } };
    $("song-add").onclick=addSongs;
    $("song-in").onkeydown=function(e){ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); addSongs(); } };
    $("file").onchange=function(e){
      var files=Array.prototype.slice.call(e.target.files||[]), room=MAXPH-photos.length;
      if(files.length>room){ toast("每場最多 "+MAXPH+" 張，已加入前 "+room+" 張"); files=files.slice(0,room); }
      Promise.all(files.map(function(f){ return compress(f).catch(function(){ return null; }); })).then(function(list){
        var ok=list.filter(Boolean); photos=photos.concat(ok);
        if(ok.length<files.length) toast("有 "+(files.length-ok.length)+" 張無法讀取");
        drawPhotos();
      });
      e.target.value="";
    };
    $("cancel").onclick=function(){ isNew?close():showDetail(i.id); };
    $("saveb").onclick=function(){
      addSongs(); addMood();
      var artist=$("f-artist").value.trim();
      if(!artist){ toast("請先填寫藝人或團體名稱"); $("f-artist").focus(); return; }
      var rec={ id:isNew?Date.now():i.id, artist:artist, tour:$("f-tour").value.trim(), date:$("f-date").value, seat:$("f-seat").value.trim(),
        venue:$("f-venue").value.trim(), rating:rating, moods:moods, songs:songs, photos:photos, moment:$("f-moment").value.trim(), note:$("f-note").value.trim() };
      if(isNew) items.push(rec); else items=items.map(function(x){return x.id===rec.id?rec:x;});
      save(); render(); showDetail(rec.id); toast("已儲存");
    };
  }

  $("add").onclick=function(){ showForm(null); };
  $("q").oninput=function(e){ q=e.target.value; render(); };
  $("list").onclick=function(e){ var t=e.target.closest(".ticket"); if(t) showDetail(+t.getAttribute("data-id")); };
  $("bg").onclick=function(e){ if(e.target===$("bg")) close(); };
  $("lb").onclick=function(){ $("lb").classList.remove("open"); };
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if($("lb").classList.contains("open")) $("lb").classList.remove("open"); else close(); } });

  render();
  load().then(function(v){ items=v; loaded=true; render(); });
})();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
